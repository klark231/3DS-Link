name: build
on:
  push:
  workflow_dispatch:
    inputs:
      enable_chat:
        description: 'Enable Chat Feature (Build with CHAT=1)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # This passes CHAT=1 to your shell scripts if the box is ticked, otherwise CHAT=0
    env:
      CHAT: ${{ github.event.inputs.enable_chat == 'true' && '1' || '0' }}
      
    steps:
      - uses: actions/checkout@v4
      
      - run: bash AzaharLink/Tests/policy_check.sh
      
      - run: bash tools_ctr/build_tools.sh
      
      - run: bash DlpLink/tools/build_all.sh --dist
      
      - uses: actions/upload-artifact@v4
        with:
          name: 3DSLink
          path: |
            AzaharLink/AzaharLink.3gx
            AzaharLink/ConfigApp/3DSLink.3dsx
            DlpLink/out/3dslink.cia
            
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            AzaharLink/AzaharLink.3gx
            AzaharLink/ConfigApp/3DSLink.3dsx
            DlpLink/out/3dslink.cia